[package]
name = "gestion-boutique-desktop"
version = "0.1.5"
description = "Gestion Boutique — application desktop (POS offline-first)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Écriture dans le stockage public Android (MediaStore) — voir CLAUDE.md,
# journal sur l'écriture native Android. Uniquement Android : ce crate ne
# supporte aucune autre plateforme (voir ses métadonnées Cargo).
# legacy_storage_permission : nécessaire pour Android 9 (API 28) et
# inférieur (ex. BlueStacks, souvent Android 9 "Pie") — déclare
# automatiquement WRITE_EXTERNAL_STORAGE/READ_EXTERNAL_STORAGE au build sur
# ces versions uniquement ; sans effet sur Android 10+ (MediaStore natif).
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = { version = "29", features = ["legacy_storage_permission"] }

[lib]
name = "gestion_boutique_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gestion-boutique-desktop"
path = "src/main.rs"
