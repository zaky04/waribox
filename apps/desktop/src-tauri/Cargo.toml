[package]
name = "gestion-boutique-desktop"
version = "0.1.5"
description = "Gestion Boutique — application desktop (POS offline-first)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Appel HTTP natif (contourne CORS/contenu mixte du WebView) — nécessaire
# pour la certification FNE (voir CLAUDE.md) : le bac à sable DGI est en
# `http://` simple, qu'un `fetch()` classique dans une PWA servie en HTTPS
# bloquerait (contenu mixte), sans garantie que le serveur DGI envoie de
# toute façon les en-têtes CORS attendus d'un appel navigateur. Utile
# desktop comme Android, pas de bloc `[target...]` dédié.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mode réseau local (Master) — voir CLAUDE.md, section mode réseau : le
# Master héberge un serveur WebSocket en clair (ws://, pas de TLS — un
# Worker JS/WebView ne peut pas épingler un certificat auto-signé comme le
# ferait un client natif), protégé par un jeton de pairage applicatif. tokio
# est déjà une dépendance transitive de tauri (voir Cargo.lock) : la version
# "1" ici réutilise la même résolution, pas une nouvelle version parallèle.
tokio = { version = "1", features = ["net", "rt", "sync", "macros"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
local-ip-address = "0.6"
# Découverte automatique (annonce côté Master, recherche côté Worker) — voir
# CLAUDE.md, mode réseau Phase 1b. Pure Rust, cross-platform, testé en
# conditions réelles (annonce + résolution sur l'interface réseau réelle,
# pas seulement compilé) avant d'être ajouté ici.
mdns-sd = "0.11"

# Écriture dans le stockage public Android (MediaStore) — voir CLAUDE.md,
# journal sur l'écriture native Android. Uniquement Android : ce crate ne
# supporte aucune autre plateforme (voir ses métadonnées Cargo).
# legacy_storage_permission : nécessaire pour Android 9 (API 28) et
# inférieur (ex. BlueStacks, souvent Android 9 "Pie") — déclare
# automatiquement WRITE_EXTERNAL_STORAGE/READ_EXTERNAL_STORAGE au build sur
# ces versions uniquement ; sans effet sur Android 10+ (MediaStore natif).
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = { version = "29", features = ["legacy_storage_permission"] }

[lib]
name = "gestion_boutique_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gestion-boutique-desktop"
path = "src/main.rs"
